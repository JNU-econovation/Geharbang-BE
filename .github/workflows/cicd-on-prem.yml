name: build & deploy to mac-mini

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - dev-test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: build with gradle
        run: ./gradlew build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: build/libs/dev.jar

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-result
          path: guesthouse/jeju/archive

      - name: Revive Docker and Infrastructure
        run: |
          # 1. 도커 데스크탑 실행 (맥 전용)
          echo "Starting Docker Desktop..."
          open -a Docker

          # 2. 도커 데몬이 완전히 뜰 때까지 대기 (최대 1분)
          ITER=0
          until docker info >/dev/null 2>&1 || [ $ITER -eq 12 ]; do
            echo "Waiting for Docker daemon... ($((ITER*5))s)"
            sleep 5
            ITER=$((ITER+1))
          done

          # 3. 필수 네트워크 존재 여부 확인 및 생성 (지난번 발생한 guesthouse 오류 방지)
          docker network inspect guesthouse >/dev/null 2>&1 || \
            (echo "Creating guesthouse network..." && docker network create guesthouse)

          # 4. DB 컨테이너 상태 확인 및 시작
          echo "Checking server-mysql status..."
          if [ "$(docker ps -aq -f name=server-mysql)" ]; then
            docker start server-mysql

            # 5. 네트워크가 끊어져 있을 경우를 대비해 다시 연결
            docker network connect guesthouse server-mysql || true
          else
            echo "Error: server-mysql container not found!"
            exit 1
          fi

      - name: exec.deploy.sh
        run: |
          cd guesthouse/jeju
          sh deploy.sh

      - name: Discord 배포 성공 알림
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: "서버 배포 완료"
          description: |
            브랜치: `${{ github.ref_name }}`
            커밋: ${{ github.event.head_commit.message }}
            배포자: ${{ github.actor }}
          color: 0x00FF00

      - name: Discord 배포 실패 알림
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: "서버 배포 실패"
          description: |
            브랜치: `${{ github.ref_name }}`
            커밋: ${{ github.event.head_commit.message }}
            배포자: ${{ github.actor }}
            워크플로우를 확인해주세요!
          color: 0xFF0000

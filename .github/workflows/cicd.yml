name: build & deploy to Google Cloud Server

on : 
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
            java-version: 21
            distribution: temurin

      - name: grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: build with gradle
        run: ./gradlew build

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: build/libs/dev.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-result
          path: build/libs

      - name: scp to Google Cloud Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GOOGLE_SERVER_HOST }}
          username: ${{ secrets.GOOGLE_SERVER_USERNAME }}
          key: ${{ secrets.GOOGLE_SERVER_KEY }}
          source: "./build/libs/dev.jar"
          target: "./jeju/archive"

      - name: exec.deploy.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GOOGLE_SERVER_HOST }}
          username: ${{ secrets.GOOGLE_SERVER_USERNAME }}
          key: ${{ secrets.GOOGLE_SERVER_KEY }}
          script: |
            cd jeju
            sh deploy.sh
    

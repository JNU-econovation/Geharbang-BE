spring:
  profiles:
    default: local

  application:
    name: guesthouse
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

oauth2:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    secret-key: ${GOOGLE_SECRET_KEY}
  base-redirect-uri: ${BASE_REDIRECT_URI}


jwt:
  token:
    secret-key: ${JWT_SECRET_KEY}
    access-expiration-time: ${JWT_ACCESS_EXPIRATION_TIME}
    refresh-expiration-time: ${JWT_REFRESH_EXPIRATION_TIME}

image:
  directory:
    path: ${IMAGE_DIRECTORY_PATH}

certificate:
  directory:
    path: ${CERTIFICATE_DIRECTORY_PATH}
